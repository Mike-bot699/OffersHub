[project]
name = "egi-backend"
version = "0.1.0"
description = "Ecommerce Growth Intelligence API"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "apscheduler>=3.11.3",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# B008: FastAPI's Depends()/File()/Query() defaults are the framework idiom.
# B023: row-accessor lambdas are called immediately inside their own loop iteration.
ignore = ["B008", "B023", "ISC004", "RUF012", "FURB162", "SIM102", "PLC0206"]
