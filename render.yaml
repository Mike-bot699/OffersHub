# Render Blueprint: one web service built from the Dockerfile, with a persistent disk for the
# SQLite database. Secrets are generated by Render or entered in its dashboard — never committed.
services:
  - type: web
    name: offershub
    runtime: docker
    plan: starter            # a persistent disk needs a paid instance
    healthCheckPath: /api/health
    disk:
      name: offershub-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: EGI_ENV
        value: hosted
      - key: EGI_DATABASE_URL
        value: sqlite:////var/data/egi.db
      - key: EGI_AUTH_MODE
        value: password
      - key: EGI_AUTH_PASSWORD
        sync: false          # you type it in Render when creating the service
      - key: EGI_SECRET_KEY
        generateValue: true  # encrypts the Eli Z API keys; keep it if you move the database
      - key: EGI_SCHEDULER_ENABLED
        value: "true"
