# Render Blueprint (free plan). The database lives on Neon (free Postgres): paste its connection
# string in EGI_DATABASE_URL when Render asks. Secrets are entered in Render, never committed.
services:
  - type: web
    name: offershub
    runtime: docker
    plan: free
    region: ohio           # same region as the Neon database (AWS US East 2)
    healthCheckPath: /api/health
    envVars:
      - key: EGI_ENV
        value: hosted
      - key: EGI_DATABASE_URL
        sync: false          # Neon connection string, e.g. postgresql://user:pass@ep-xxx.neon.tech/neondb?sslmode=require
      - key: EGI_AUTH_MODE
        value: password
      - key: EGI_AUTH_PASSWORD
        sync: false          # the password you will use to sign in
      - key: EGI_SECRET_KEY
        generateValue: true  # encrypts the Eli Z API keys; keep it as long as you keep the database
      - key: EGI_SCHEDULER_ENABLED
        value: "true"
